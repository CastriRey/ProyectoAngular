<app-nav />

<main class="page-main sales-page">
  @if (error() && !formularioVisible() && !ventaSeleccionada()) { <p class="alert" role="alert">{{ error() }}</p> }

  @if (formularioVisible()) {
    <app-venta-form
      [form]="form"
      [clientes]="clientes()"
      [productos]="productos()"
      [metodosPago]="metodosPago()"
      [serviciosFinalizados]="serviciosFinalizadosDelCliente()"
      [serviciosSeleccionados]="serviciosSeleccionados()"
      [lineas]="lineas()"
      [total]="total()"
      [productoSeleccionado]="productoSeleccionado()"
      [cantidadSeleccionada]="cantidadSeleccionada()"
      [guardando]="guardando()"
      [error]="error()"
      (clienteChange)="cambiarCliente()"
      (servicioChange)="alternarServicio($event.id, $event.event)"
      (productoChange)="actualizarProductoSeleccionado()"
      (cantidadChange)="actualizarCantidad($event)"
      (agregarProducto)="agregarProducto()"
      (quitarProducto)="quitarProducto($event)"
      (completarVenta)="completarVenta()"
      (cancelar)="cancelar()"
    />
  } @else if (ventaSeleccionada(); as venta) {
    <app-venta-invoice
      [venta]="venta"
      [cliente]="clienteDeVenta()"
      [productoDeVenta]="productoLookup"
      (imprimir)="imprimirFactura()"
      (nuevaVenta)="nueva()"
      (verVentas)="cancelar()"
    />
  } @else {
    <app-ventas-list
      [ventas]="ventasFiltradas()"
      [cargando]="cargando()"
      [busqueda]="busqueda()"
      (busquedaChange)="busqueda.set($event)"
      (nuevaVenta)="nueva()"
      (verVenta)="ver($event)"
    />
  }
</main>
